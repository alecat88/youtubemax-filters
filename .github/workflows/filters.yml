name: Build and publish ad filters

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'filters/**'
      - 'src/**'
      - '.github/workflows/filters.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build filters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build filter list
        run: node filters/build-filters.mjs --previous-url https://alecat88.github.io/youtubemax-filters/filters.json

      - name: Test engine against the built list
        run: node filters/test-engine.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: filters/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
